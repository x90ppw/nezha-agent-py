name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all sources
        run: python -m py_compile main.py config.py binary.py nezha/*.py
      - name: Unit tests (codecs, HPACK RFC 7541 vectors)
        run: python -m unittest discover -s tests -v
      - name: Integration test against fake dashboard (node)
        run: python tests/run_integration.py
